name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest
      - run: ruff check prodmm/scoring.py score_dms.py tests examples
      - run: python -m build
      - run: prodmm-score-dms --help
      - run: prodmm-seq2seq --help

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[train,dev]'
      - run: python -m pytest tests/test_seq2seq_training.py
      - run: ruff check prodmm/seq2seq/datamodule.py prodmm/seq2seq/lightning_module_finetuning.py prodmm/seq2seq/collators/seq2seq.py finetunes/finetune_seq2seq/finetune_seq2seq.py
